[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audri"
version = "0.2.0"
description = "Bounded streaming speech framework with Fish Speech and Qwen backends"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# The audio/session/chunking core and diagnostic backend use only the stdlib.
dependencies = []

[project.scripts]
audri = "audri.cli:main"

[project.optional-dependencies]
fish = ["httpx>=0.28.1,<0.29"]
server = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]
playback = ["sounddevice>=0.5,<0.6"]
# Install TTS inference stack outside the hermetic container environment.
# Inside the container, use `just build-env` instead.
tts = [
    "numpy>=2.0",
    "torch>=2.0",
    "transformers==4.57.3",
    "accelerate",
    "qwen-tts==0.1.1",
    "librosa",
    "soxr",
    "soundfile",
    "onnxruntime",
    "einops",
    "sox",
]

[project.urls]
Repository = "https://github.com/phi9t/audri"

[dependency-groups]
dev = ["ruff>=0.14,<1"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".sygaldry", ".codex-zephyr-mlsys"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel]
packages = ["src/audri"]
